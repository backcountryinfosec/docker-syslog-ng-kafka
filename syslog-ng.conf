@version: 4.12
@include "scl.conf"

# Example configuration. Mount your own over /etc/syslog-ng/syslog-ng.conf:
#   docker run ... -v ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf ...

options { chain_hostnames(off); flush_lines(0); use_dns(no); use_fqdn(no);
          owner("root"); group("adm"); perm(0640); stats(freq(0));
          bad_hostname("^gconfd$");
};

########################
# Sources
########################
source s_net {
    network(ip(0.0.0.0) transport("udp") port(514));
    network(ip(0.0.0.0) transport("tcp") port(514));
    syslog(ip(0.0.0.0) transport("tcp") port(601));
};

#source s_mqtt {
#    mqtt(
