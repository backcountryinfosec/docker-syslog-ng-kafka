#        topic("some/topic/#")
#        username("user")
#        password("changeme")
#    );
#};

########################
# Destinations
########################
destination d_file { file("/mnt/logs/${HOST}_${PROGRAM}.log" create-dirs(yes)); };

#destination d_kafka {
#    kafka-c(
#        bootstrap-servers("kafka:9092")
#        topic("syslog")
#        message("$(format-json --scope rfc5424 --scope nv-pairs)")
#        config(
#            queue.buffering.max.ms("1000")
#        )
#    );
#};

########################
# Log paths
########################
log { source(s_net); destination(d_file); };
#log { source(s_net); destination(d_kafka); };

@include "/etc/syslog-ng/conf.d/*.conf"
